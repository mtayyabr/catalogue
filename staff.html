<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dollar Store – Driver</title>
<link rel="icon" type="image/png" href="img/icon-192.png">
<meta name="theme-color" content="#FFD101">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800;900&display=swap">
<style>
:root{--hot:#F2460D;--green:#0A8A3A;--green-bg:#E9F7EE;--ink:#222;--ink2:#555;--ink3:#8A8A8A;--line:#EDEDED;--soft:#F6F6F6;--red:#C62828}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#fff;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
header{position:sticky;top:0;z-index:5;background:#FFD101;padding:10px 16px;display:flex;align-items:center;gap:10px}
header img{width:36px;height:36px;border-radius:8px}
header b{font-size:18px;font-weight:900;flex:1}
header button{height:34px;padding:0 12px;border-radius:999px;background:#222;color:#fff;font-weight:800;font-size:13px}
main{max-width:560px;margin:0 auto;padding:14px 16px 40px;display:grid;gap:14px}
h2{margin:6px 0 0;font-size:17px;font-weight:900}
.muted{color:var(--ink2);font-size:13px;margin:0}
.btn{height:48px;border-radius:999px;background:var(--hot);color:#fff;font-weight:800;font-size:16px;padding:0 18px;width:100%}
.btn:disabled{opacity:.5}
input{height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;width:100%;font-size:16px;outline:0}
input:focus{border-color:var(--ink)}
.pin{display:grid;gap:12px;max-width:320px;margin:40px auto 0;text-align:center}
.pin input{text-align:center;font-size:28px;letter-spacing:10px;font-weight:800}
.err{color:var(--red);font-size:13.5px;font-weight:700}
.ok{color:var(--green);font-size:13.5px;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs button{height:42px;border-radius:10px;border:1.5px solid var(--line);font-weight:800}
.tabs button[aria-pressed="true"]{background:#222;border-color:#222;color:#fff}
.o{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.o .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.o .id{font-weight:900;font-size:16px}
.o .tot{font-weight:900;font-size:16px;color:var(--hot)}
.o .meta{font-size:13.5px;color:var(--ink2);line-height:1.4;white-space:pre-line}
.o .items{font-size:13px;background:var(--soft);border-radius:8px;padding:8px 10px;white-space:pre-line;line-height:1.4}
.o .acts{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.o .acts button{height:46px;border-radius:12px;font-weight:900;font-size:15px;white-space:nowrap}
.o .row{font-size:14px;line-height:1.45;display:flex;gap:6px}.o .row.warn{color:#B26A00;font-weight:700}
.o .del{background:var(--green);color:#fff}
.o .ref{background:#FDECEA;color:var(--red)}
.ii{display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.3}
.ii img{width:56px;height:56px;border-radius:8px;border:1px solid var(--line);object-fit:cover;flex:none;background:#fff}
.ii b{font-size:15px;margin-inline-end:4px}
.o a{color:var(--green);font-weight:800;text-decoration:none}
.o.done{opacity:.55}
.empty{text-align:center;color:var(--ink3);padding:30px 0}
</style>
</head>
<body>
<header><img src="img/icon-192.png" alt=""><b>Driver &amp; Returns</b><button id="refresh" hidden>Refresh</button></header>
<main id="app"></main>
<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbxtd4KzDWF7bJy2a1JQRsQ-p5uwguWEhWnwxsy5leuTRNPAycScWu791JamyTQypvD99A/exec";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ss={get(k){try{return sessionStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{v?sessionStorage.setItem(k,v):sessionStorage.removeItem(k)}catch(e){}}};
const apiGet=p=>fetch(SHEET_URL+"?"+new URLSearchParams(p)).then(r=>r.json());
const apiPost=o=>fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)}).then(r=>r.json());
let PIN=ss.get("ds_pin"), view="orders", orders=[];

function pinView(msg){
  $("#refresh").hidden=true;
  app.innerHTML=`<form class="pin" id="pf"><h2>Enter staff PIN</h2><input id="pin" inputmode="numeric" maxlength="6" autocomplete="off" autofocus>
    <div class="err">${msg||""}</div><button class="btn">Open</button></form>`;
  $("#pf").onsubmit=e=>{e.preventDefault();PIN=$("#pin").value.trim();load();};
}
async function load(){
  app.innerHTML=`<p class="empty">Loading…</p>`;
  try{
    const r=await apiGet({action:"open",pin:PIN});
    if(!r.ok){ ss.set("ds_pin",""); return pinView("Wrong PIN"); }
    ss.set("ds_pin",PIN); orders=r.orders; $("#refresh").hidden=false; draw();
  }catch(_){ app.innerHTML=`<p class="empty">Couldn't connect. Check internet.</p><button class="btn" onclick="load()">Try again</button>`; }
}
function itemsHTML(o){
  const ids=String(o.ids||"").split(",").filter(Boolean), lines=String(o.items||"").split("\n");
  if(!ids.length) return `<div class="items">${esc(o.items)}</div>`;
  return `<div style="display:grid;gap:8px">${ids.map((x,i)=>{const id=parseInt(x);return `<div class="ii"><img src="img/${id}-t.jpg" alt="" loading="lazy"><span>${esc(lines[i]||x)}</span></div>`;}).join("")}</div>`;
}
function draw(){
  const tabs=`<div class="tabs"><button data-v="orders" aria-pressed="${view==="orders"}">Deliveries (${orders.length})</button><button data-v="returns" aria-pressed="${view==="returns"}">Returns</button></div>`;
  if(view==="returns"){
    app.innerHTML=tabs+`<h2>Customer returned items</h2><p class="muted">Enter the order number from the receipt and the value of the returned items. Affiliate commission is adjusted automatically.</p>
      <form id="rf" style="display:grid;gap:10px">
        <input id="rId" placeholder="Order #  e.g. DS-7K2P" autocapitalize="characters" autocomplete="off">
        <input id="rAmt" inputmode="decimal" placeholder="Returned value (OMR)  e.g. 1.458">
        <p class="muted" id="rHint">Each item is 0.729 OMR – 2 items = 1.458</p>
        <div id="rMsg"></div><button class="btn">Save return</button></form>`;
    $("#rf").onsubmit=async e=>{ e.preventDefault();
      const id=$("#rId").value.trim().toUpperCase(), amount=parseFloat($("#rAmt").value), m=$("#rMsg"), b=e.target.querySelector("button");
      if(!id||!(amount>0)){ m.className="err"; m.textContent="Enter order # and amount"; return; }
      b.disabled=true; m.textContent="";
      try{ const r=await apiPost({action:"return",pin:PIN,id,amount});
        if(r.ok){ m.className="ok"; m.textContent=`Saved ✓ ${id} – ${amount.toFixed(3)} OMR returned`+(r.deducted?` (affiliate −${r.deducted.toFixed(3)})`:""); $("#rId").value=""; $("#rAmt").value=""; }
        else { m.className="err"; m.textContent=r.err==="notfound"?"Order not found":r.err==="amount"?`Amount too high – max ${Number(r.max).toFixed(3)} OMR`:r.err==="pin"?"PIN expired, reload":"Could not save"; }
      }catch(_){ m.className="err"; m.textContent="Couldn't connect. Try again."; }
      b.disabled=false; };
  } else {
    app.innerHTML=tabs+(orders.length?orders.map((o,i)=>`<div class="o" id="o${i}">
      <div class="top"><span class="id">${esc(o.id)}</span><span class="tot">${Number(o.total).toFixed(3)} OMR</span></div>
      <div class="row">👤 <span>${esc(o.name||"No name")}</span></div>
      <div class="row">📞 <span><a href="tel:+${esc(o.phone.replace(/\D/g,""))}">+${esc(o.phone.replace(/\D/g,""))}</a> · <a href="https://api.whatsapp.com/send?phone=${esc(o.phone.replace(/\D/g,""))}" target="_blank" rel="noopener">WhatsApp</a></span></div>
      <div class="row${o.area?"":" warn"}">📍 <span>${o.area?esc(o.area):"No address given – call or WhatsApp the customer"}</span></div>
      <div class="row">🕒 <span>${new Date(o.date).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} · ${esc(String(o.items).split("\n").length)} line(s) · cash ${Number(o.total).toFixed(3)} OMR</span></div>
      ${itemsHTML(o)}
      <div class="acts"><button class="del" data-i="${i}" data-s="Delivered">✔ Delivered</button><button class="ref" data-i="${i}" data-s="Refused">✖ Refused</button></div>
      <div class="msg"></div></div>`).join("")
      :`<p class="empty">No open orders 🎉</p>`)+`<p class="muted" style="text-align:center">Orders not marked become Delivered automatically after 3 days.</p>`;
  }
}
document.addEventListener("click",async e=>{
  const v=e.target.closest("[data-v]"); if(v){ view=v.dataset.v; draw(); return; }
  const b=e.target.closest("[data-s]"); if(!b) return;
  const i=+b.dataset.i, o=orders[i], card=$("#o"+i), st=b.dataset.s;
  if(st==="Refused" && !confirmRefuse(card)) return;
  card.querySelectorAll("button").forEach(x=>x.disabled=true);
  try{ const r=await apiPost({action:"status",pin:PIN,id:o.id,status:st});
    if(r.ok){ card.classList.add("done"); card.querySelector(".acts").outerHTML=`<div class="${st==="Delivered"?"ok":"err"}">${st==="Delivered"?"✔ Delivered":"✖ Refused"} – saved</div>`; }
    else { card.querySelector(".msg").innerHTML=`<span class="err">Could not save (${esc(r.err||"")})</span>`; card.querySelectorAll("button").forEach(x=>x.disabled=false); }
  }catch(_){ card.querySelector(".msg").innerHTML=`<span class="err">No connection – try again</span>`; card.querySelectorAll("button").forEach(x=>x.disabled=false); }
});
/* two-tap confirm for Refused (no pop-up dialogs) */
function confirmRefuse(card){ const b=card.querySelector(".ref"); if(b.dataset.sure) return true; b.dataset.sure=1; b.textContent="Tap again"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.sure; b.textContent="✖ Refused"; } },3000); return false; }
$("#refresh").onclick=load;
PIN?load():pinView();
</script>
</body>
</html>
