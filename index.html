<title>Dollar Store Oman</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFD101">
<meta name="description" content="Everything 0.729 OMR. Free delivery on orders of 10 OMR or more. Cash on delivery. Lifetime money-back on unused items.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mtayyabr.github.io/catalogue/">
<meta property="og:title" content="Dollar Store Oman – Everything 0.729 OMR">
<meta property="og:description" content="Free delivery on orders of 10 OMR or more · Cash on delivery · كل شيء بـ 0.729 ر.ع.">
<meta property="og:image" content="https://mtayyabr.github.io/catalogue/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dollar Store">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: marketplace app shell. Sticky yellow header (logo, search, back, cart) + green trust strip,
   text tabs, dense 2-col photo grid on white, bottom tab bar. Product / cart / checkout / done are full pages.
   Deliberately light-only, like a shopping app; every colour is set explicitly. */
:root{
  color-scheme:light;
  --brand:#FFD200;        /* store yellow (logo) */
  --hot:#F2460D;          /* prices + main buttons */
  --hot-dark:#D23A06;
  --green:#0A8A3A;        /* free delivery / trust */
  --green-bg:#E9F7EE;
  --ink:#222222; --ink2:#555555; --ink3:#8A8A8A;
  --line:#EDEDED; --page:#FFFFFF; --soft:#F6F6F6; --deal:#FFF3EC;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --navh:58px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html[lang="ar"]{--font:"Tajawal","Figtree",system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
[dir="rtl"] .flip{transform:scaleX(-1)}
[dir="rtl"] .badge{right:auto;left:-3px}
[dir="rtl"] nav.bn .badge{left:calc(50% - 22px);right:auto}
[dir="rtl"] .card .flag{left:auto;right:0;border-top-right-radius:0;border-top-left-radius:8px}
[dir="rtl"] .card .nm{text-align:right}
[dir="rtl"] .mini{text-align:right}
[dir="rtl"] .addc .q{right:auto;left:-6px}
[dir="rtl"] .search{padding-left:0;padding-right:14px}
[dir="rtl"] .search .go{margin-right:0;margin-left:3px}
[dir="rtl"] .gal figcaption{left:auto;right:10px}
[dir="rtl"] .counter{right:auto;left:10px}
[dir="rtl"] .tot{padding-right:0;padding-left:4px}
[dir="rtl"] .cat-row{text-align:right}
[dir="rtl"] .cat-row .pics img{margin-left:0;margin-right:-14px}
[dir="rtl"] .cat-row .pics img:first-child{margin-right:0}
.trust .track{direction:ltr}
.trust span{unicode-bidi:plaintext}
.langbtn{flex-shrink:0;height:40px;min-width:40px;padding:0 8px;border-radius:999px;background:#fff;border:2px solid var(--ink);font-weight:800;font-size:14px;color:var(--ink)}
.lang-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang-row button{height:46px;border-radius:10px;border:1.5px solid var(--line);font-weight:800;font-size:15px}
.lang-row button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
html,body{background:var(--page)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.35;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:12px}

/* ---------- header ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--brand)}
.sdd{position:absolute;left:0;right:0;top:100%;z-index:51}
.sdd-in{background:#fff;border-radius:0 0 16px 16px;box-shadow:0 12px 28px rgba(0,0,0,.18);max-height:min(72vh,620px);overflow-y:auto;padding:6px 0 10px;overscroll-behavior:contain}
.sdd-scrim{position:fixed;inset:0;z-index:49;background:rgba(0,0,0,.35)}
.sdd h4{margin:10px 14px 4px;font-size:12px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.sdd .row{display:flex;align-items:center;gap:12px;width:100%;padding:8px 14px;text-align:start;font-size:15px;font-weight:600;color:var(--ink);text-decoration:none}
.sdd .row:active{background:var(--soft)}
.sdd .row img{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:none;background:#fff}
.sdd .row .ic{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none;font-size:18px}
.sdd .row small{margin-inline-start:auto;color:var(--ink3);font-weight:600;font-size:12.5px}
.sdd .langs{display:flex;gap:8px;padding:6px 14px}
.sdd .langs button{flex:1;height:38px;border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:14px}
.sdd .langs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hrow{display:flex;align-items:center;gap:8px;padding-block:8px}
.logo{flex-shrink:0;display:block;width:36px;height:46px;border-radius:7px;overflow:hidden;background:var(--brand)}
.logo img{width:100%;height:100%;object-fit:cover}
.search{flex:1;min-width:0;display:flex;align-items:center;height:40px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding-left:14px;overflow:hidden}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--ink)}
.search .go{height:30px;width:44px;margin-right:3px;border-radius:999px;background:var(--ink);color:#fff;display:grid;place-items:center;flex-shrink:0}
.icobtn{position:relative;flex-shrink:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.icobtn.back{background:#fff;border:2px solid var(--ink)}
.icobtn.cart{background:var(--ink);color:var(--brand)}
.badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--hot);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--brand)}
.trust{background:#fff;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
.trust .track{display:inline-flex;gap:22px;padding:7px 12px;animation:slide 28s linear infinite}
.trust span{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-weight:700;font-size:12.5px}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.trust .track{animation:none}}

/* slim bar (cart / checkout / done) */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 6px}
.topbar h1{margin:0;font-size:16.5px;font-weight:800}
.tb-back{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
/* floating buttons over product photo */
.float{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;padding:0 10px;pointer-events:none;max-width:620px;margin:0 auto}
.fbtn{pointer-events:auto;position:relative;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 1px 6px rgba(0,0,0,.18);display:grid;place-items:center;color:var(--ink)}
.fbtn .badge{border-color:#fff}
.float.solid{background:#fff;max-width:none;padding:6px 10px;top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 var(--line)}
.float.solid .fbtn{box-shadow:none;background:var(--soft)}
.trust{margin:0 -12px}

/* ---------- home ---------- */
.tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,56px));z-index:40}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:11px 2px 9px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;font-size:14.5px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:800;border-color:var(--ink)}

.promo{margin-top:12px;border-radius:14px;overflow:hidden;background:linear-gradient(100deg,#FF5A1F 0%,#F2460D 55%,#E0300A 100%);color:#fff}
.promo-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 4px}
.promo h2{margin:0;font-size:19px;font-weight:900;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
.promo h2 svg{flex-shrink:0}
.promo .see{font-size:12.5px;font-weight:700;opacity:.95;white-space:nowrap}
.promo p{margin:0;padding:0 14px 10px;font-size:12.5px;font-weight:600;opacity:.95}
.strip{display:flex;gap:8px;overflow-x:auto;padding:0 14px 14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mini{flex:0 0 104px;background:#fff;border-radius:10px;overflow:hidden;color:var(--ink);text-align:left}
.mini img{width:104px;height:104px;object-fit:cover;background:var(--soft)}
.mini b{display:block;padding:5px 7px 7px;color:var(--hot);font-size:15px;font-weight:900}
.mini b small{font-size:10px;font-weight:700;margin-left:1px}

.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.perk{background:var(--green-bg);border-radius:10px;padding:9px 8px;display:flex;gap:7px;align-items:flex-start;color:var(--green);min-width:0}
.perk svg{flex-shrink:0;margin-top:1px}
.perk b{display:block;font-size:12.5px;line-height:1.2;color:var(--green)}
.perk span{display:block;font-size:11px;color:#2F6E45;line-height:1.25;margin-top:2px}
@media (max-width:420px){.perk{flex-direction:column;gap:4px}}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 8px}
.sec h3{margin:0;font-size:17px;font-weight:900}
.sec span{color:var(--ink3);font-size:12.5px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 8px;padding-bottom:calc(var(--navh) + 86px + env(safe-area-inset-bottom,0px))}
@media (min-width:680px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:920px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 14px}}
.card{display:flex;flex-direction:column;min-width:0;background:#fff}
.card .ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--soft);display:block;width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .flag{position:absolute;left:0;bottom:0;background:rgba(10,138,58,.92);color:#fff;font-size:10.5px;font-weight:800;padding:3px 7px;border-top-right-radius:8px}
.card .nm{margin-top:5px;font-size:13px;color:var(--ink);line-height:1.25;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;width:100%}
.card .meta{margin-top:3px;font-size:11.5px;color:var(--green);font-weight:700;display:flex;align-items:center;gap:4px}
.card .row{display:flex;align-items:center;justify-content:space-between;margin-top:1px;gap:6px}
span.amt{display:inline!important;margin:0!important;white-space:nowrap;unicode-bidi:isolate}
.rs{height:.78em;width:auto;vertical-align:-.04em;margin-inline-end:.16em;overflow:visible}
.price{color:var(--hot);font-weight:900;font-size:19px;line-height:1.1;letter-spacing:-.3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{font-size:11px;font-weight:800;margin-left:1px;letter-spacing:0}
.phw{position:relative}
.ctl{position:absolute;bottom:8px;inset-inline-end:8px;z-index:2}
.addc,.stepper{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.18);color:var(--hot)}
.addc{width:42px;height:28px;border-radius:999px;display:grid;place-items:center;color:var(--ink);background:rgba(255,255,255,.38)!important;box-shadow:none!important;-webkit-backdrop-filter:blur(2px)!important;backdrop-filter:blur(2px)!important;border:1px solid rgba(255,255,255,.55)}
.addc svg{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95))}
.stepper{display:flex;align-items:center;height:28px;border-radius:999px;padding:0 1px}
.stepper{background:rgba(255,255,255,.38)!important;box-shadow:none!important;-webkit-backdrop-filter:blur(2px)!important;backdrop-filter:blur(2px)!important;border:1px solid rgba(255,255,255,.55)}
.stepper svg,.stepper b{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95))}
.stepper button{width:26px;height:28px;display:grid;place-items:center;color:var(--hot)}
.stepper b{min-width:14px;text-align:center;font-size:14px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.more .addc,.am-it .addc{width:36px;height:25px}
.more .addc svg,.am-it .addc svg{width:18px;height:16px}
.addc svg{width:21px;height:19px}
.stepper svg{width:15px;height:15px}
.more .stepper,.am-it .stepper{height:25px}
.more .stepper button,.am-it .stepper button{width:22px;height:25px}
.more .stepper b,.am-it .stepper b{min-width:12px;font-size:13px}
.more .ctl,.am-it .ctl{bottom:6px;inset-inline-end:6px}
.addc .q{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--hot);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.empty{grid-column:1/-1;text-align:center;color:var(--ink3);padding:40px 0}

/* ---------- free delivery bar (shared) ---------- */
.fd{background:var(--green-bg);border-radius:10px;padding:9px 11px}
.fd .t{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--green)}
.fd .t b{color:var(--hot)}
.fd .t svg{flex-shrink:0}
.fd .bar{position:relative;height:7px;border-radius:7px;background:#CBEBD6;margin-top:7px;overflow:hidden}
.fd .bar i{position:absolute;top:0;bottom:0;inset-inline-start:0;background:linear-gradient(90deg,#16A34A,var(--green));border-radius:7px;transition:width .35s}
.fd .ends{display:flex;justify-content:space-between;font-size:10.5px;color:#2F6E45;margin-top:4px;font-variant-numeric:tabular-nums}
.fd.done .bar i{background:var(--green)}

/* ---------- floating cart bar on home ---------- */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:45;padding:0 10px 8px;pointer-events:none}
.dock .in{max-width:1100px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.14);padding:8px;display:flex;gap:8px;align-items:center;pointer-events:auto}
.dock .fd{flex:1;min-width:0;padding:7px 10px}
.fdbtn{flex:1;min-width:0;position:relative;display:block;text-align:start;border-radius:10px}
.fdbtn .fd{padding:7px 30px 7px 10px}
[dir="rtl"] .fdbtn .fd{padding:7px 10px 7px 30px}
.fdbtn .chev{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.fdbtn:active .fd{filter:brightness(.96)}
.ap{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-top:12px}
.ap>*{min-width:0}
.ap h1{margin:0;font-size:22px;font-weight:900;line-height:1.2}
.ap .hero{background:linear-gradient(135deg,#FFD101,#FFB800);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center}
.ap .hero img{width:56px;height:56px;border-radius:14px;flex:none}
.ap .hero b{display:block;font-size:20px;font-weight:900;line-height:1.15}
.ap .hero span{font-size:13px;font-weight:600}
.ap ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.ap ol li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.35}
.ap ol li i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-weight:800;font-size:13px;display:grid;place-items:center}
.ap .rules{font-size:13px;color:var(--ink2);padding:10px 12px 10px 28px;margin:0;border:1px solid var(--line);border-radius:12px;display:grid;gap:5px;line-height:1.4}
[dir="rtl"] .ap .rules{padding:10px 28px 10px 12px}
.ap .chk{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14.5px}
.ap .chk input{width:22px;height:22px;accent-color:var(--hot);flex:none}
.ap .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ap .seg button{height:44px;border-radius:10px;border:1.5px solid var(--line);font-weight:800;font-size:14.5px}
.ap .seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.ap .linkbox{display:flex;gap:8px;align-items:center;border:1.5px dashed var(--ink3);border-radius:12px;padding:8px 8px 8px 12px;background:var(--soft)}
.ap .linkbox code{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left}
.ap .linkbox .btn{height:36px;font-size:14px;padding:0 14px}
.ap .muted2{font-size:12.5px;color:var(--ink2)}
.ap .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ap .stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ap .stat b{display:block;font-size:18px;font-weight:900}
.ap .stat span{font-size:12px;color:var(--ink2)}
.ap .stat.big{grid-column:1/-1;background:var(--green-bg);border-color:transparent}
.ap .stat.big b{font-size:26px;color:var(--green)}
.ap .stat b .amt,.ap .stat b span.amt{font-size:inherit!important}
a.btn{text-decoration:none}
.ap .mtabs{display:flex;gap:8px}
.ap .mtabs button{height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:13.5px}
.ap .mtabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ap .ol{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ap .ol .r{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font-size:13.5px}
.ap .ol .r+.r{border-top:1px solid var(--line)}
.ap .ol .r small{display:block;color:var(--ink3);font-size:12px}
.ap .pill{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.ap .pill.Delivered,.ap .pill.Approved{background:var(--green-bg);color:var(--green)}
.ap .pill.Refused,.ap .pill.Cancelled,.ap .pill.Rejected{background:#FDECEA;color:#C62828}
.helpaff{display:flex;gap:10px;align-items:center;text-align:start;padding:12px;border-radius:12px;background:linear-gradient(135deg,#FFD101,#FFB800);width:100%}
.helpaff b{display:block;font-size:15px;font-weight:900}.helpaff span{font-size:12.5px;font-weight:600}
.helpaff i{margin-inline-start:auto;font-style:normal;font-size:22px;font-weight:900}
.msgprev{white-space:pre-line;font-size:13.5px;line-height:1.45;background:#E7FFDB;border-radius:12px;padding:10px 12px;color:#111}
.aff{display:block;margin:10px 0 0;padding:8px 12px;border-radius:999px;background:var(--green-bg);color:var(--green);font-size:14px;font-weight:700;width:max-content;max-width:100%}
.aff b{font-weight:900}
.inst{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:#FFFBE6}
.inst img{width:42px;height:42px;border-radius:10px;flex:none}
.inst div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.inst b{font-size:14px;font-weight:800}
.inst span{font-size:12px;color:var(--ink2)}
.inst .btn{height:34px;padding:0 16px;font-size:14px;flex:none}
.inst-x{width:28px;height:28px;flex:none;border-radius:50%;color:var(--ink3);font-size:20px;line-height:1;display:grid;place-items:center}
.ist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ist li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
.ist li>i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-weight:800;font-size:13px;display:grid;place-items:center}

  g.fillStyle="#222";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))g.fillRect(Math.floor(x0+c*cs),Math.floor(y0+r*cs),Math.ceil(cs),Math.ceil(cs));
  g.fillStyle="#F2460D";g.beginPath();g.roundRect(W/2-330,1120,660,92,46);g.fill();

function go(v,replace,extra={}){
  if(v==="home"){stack=[{v:"home"}];}
