<style id="css">
/* Layout: full-screen vertical swipe feed (scroll-snap) mixing the store's own reels and lamp photos; right action rail; bilingual caption at bottom. Single dark theme in the store's green and yellow. */
:root{
  --ink:#03231a; --deep:#011510; --paper:#f7f4ec; --mute:#9fb8ad;
  --price:#ffd915; --hot:#ff4d6d; --leaf:#5fdc8f;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;height:100dvh}
body{background:var(--deep);color:var(--paper);font-family:var(--body);overflow:hidden}
.app{position:relative;height:100%;height:100dvh;max-width:480px;margin:0 auto;background:var(--ink)}
.top{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(8px + env(safe-area-inset-top,0px)) 0 22px;background:linear-gradient(#000000a6,transparent)}
.chips{position:relative;display:flex;gap:20px;overflow-x:auto;padding:6px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips::after{content:"";flex:0 0 70vw}
.adtag{position:absolute;top:calc(64px + env(safe-area-inset-top,0px));left:16px;background:#00000066;color:#fff;font:700 .7rem var(--body);padding:3px 9px;border-radius:99px;letter-spacing:.06em}
.adgreen{background:#128c7e!important;color:#fff!important}.adgreen .btn{background:#fff;color:#075e54}.adgreen .num{font:800 1.5rem var(--display)}
.adbar{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:60px 16px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#000000e6 60%);text-align:center}
.adbar .adtag{position:static;display:inline-block;margin-bottom:6px}
.adh{font:800 2.4rem var(--display);color:var(--price);display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap}.adh .omr{background:var(--price);width:1.3em;height:.75em;margin:0}
.adp{margin:2px 0 12px;font-weight:600}.adcoupon .btn{font-size:1rem;padding:13px 22px;background:var(--price);color:var(--ink)}
.chip{flex:none;background:none;border:0;border-bottom:2px solid transparent;color:#ffffffb3;font:600 .95rem var(--body);padding:6px 0;cursor:pointer;text-shadow:0 1px 3px #0009}
.chip[aria-pressed="true"]{color:#fff;border-bottom-color:#fff}
:focus-visible{outline:2px solid var(--price);outline-offset:2px}

.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.card{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.bgblur{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) brightness(.72) saturate(1.2);transform:scale(1.1)}
.media{position:absolute;left:0;right:0;top:calc(54px + env(safe-area-inset-top,0px));bottom:178px;width:100%;height:auto;object-fit:contain;object-position:center}
.gal{position:absolute;left:0;right:0;top:calc(54px + env(safe-area-inset-top,0px));bottom:178px;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:none;width:100%;height:100%;object-fit:contain;object-position:center;scroll-snap-align:center}
.card.on .media,.card.on .gal img{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.dots{position:absolute;z-index:3;top:calc(48px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;gap:4px}
.dots i{flex:1;height:3px;border-radius:2px;background:#ffffff59}
.dots i.on{background:#fff}

.rail{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;gap:14px;z-index:3}

.price .was{font:600 .8rem var(--body);opacity:.65;margin-inline-start:6px}
.price .until{font:700 .62rem var(--body);background:var(--ink);color:var(--price);padding:2px 7px;border-radius:99px;margin-inline-start:6px;align-self:center}
.avwrap{position:relative;display:block;margin-bottom:10px;text-decoration:none}

function renderChips(){chips.innerHTML=CATS.map(([en,ar])=>`<button class="chip" id="chip-${en}" aria-pressed="${state.cat===en}" data-cat="${en}">${en} · ${ar}</button>`).join("")}
function card(p){
  const liked=!!state.liked[p.id],saved=!!state.saved[p.id];
  const imgs=p.gallery||[p.src];
  const stage=p.gallery
    ?`<div class="gal">${imgs.map((g,i)=>`<img src="${g}" alt="${esc(p.en)}, photo ${i+1}">`).join("")}</div><div class="dots">${imgs.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`
    :`<img class="media" loading="lazy" src="${p.src}" alt="${esc(p.en)}">`;
  const pre=p.only?"ONLY · فقط":p.unit?"PER PIECE · للقطعة":"FROM · ابتداءً من";
  const ai=p.ai||"";
  return `<section class="card" data-id="${p.id}" aria-label="${esc(p.en)}">
    <div class="bgblur" data-bg="${imgs[0]}"></div>
    ${stage}
    <div class="rail">
      <a class="avwrap" href="https://www.instagram.com/dollar.store.oman/" target="_blank" rel="noopener" aria-label="Dollar Store Oman on Instagram"><span class="avatar"><img src="logo.png" alt="Dollar Store Oman"></span><b class="plus">+</b></a>
      <button class="act like" aria-pressed="${liked}" data-like="${p.id}"><i>${ICON.heart}</i><span>${liked?"Liked":"Like"}</span></button>
      <button class="act save" aria-pressed="${saved}" data-save="${p.id}"><i>${ICON.save}</i><span>${saved?"Saved":"Save"}</span></button>
      <a class="act wa" href="${waLink(p)}" target="_blank" rel="noopener" aria-label="Chat on WhatsApp about ${esc(p.en)}"><i>${ICON.phone}</i><span>WhatsApp</span></a>
      <a class="act dir" href="${esc(mapsLink())}" target="_blank" rel="noopener" aria-label="Get directions to the store"><i>${ICON.pin}</i><span>Directions</span></a>
      <button class="act" data-share="${p.id}"><i>${ICON.share}</i><span>Share</span></button>
      <div class="disc" aria-hidden="true"><img src="logo.png" alt=""></div>
    </div>
    <div class="cap">
      <div class="handle">@dollar.store.oman</div>
      <div class="name">${esc(p.en)}</div>
      <div class="ar" dir="rtl" lang="ar">${esc(p.ar)}</div>
      <div class="price">${esc(priceOf(p))}<i class="omr" role="img" aria-label="OMR"></i>${promoOn(p)?`<s class="was">0.729</s><span class="until">until 3 Nov</span>`:""}</div>
      <button class="more" data-more>More · المزيد</button>
      <div class="music" aria-hidden="true"><span>♬</span><div><em>Dollar Store Oman · Direct imports, one simple price · استيراد مباشر، سعر بسيط</em></div></div>
      <div class="details">${p.spec?`<div class="spec">${esc(p.spec)}</div>`:""}<div class="hook">${esc(p.hook)}</div></div>
      ${ai?`<div class="aitag">${esc(ai)}</div>`:""}
    </div>
  </section>`;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let adN=0,sinceAd=0,feedSeq=[],shown=new Set(),loading=false;
function infoCard(){return `<section class="card end ad">
    <img class="logo" src="logo.png" alt="Dollar Store Oman">
    <div class="big">${esc(STORE.big)}</div>
    <h2>Direct imports. One simple price.</h2>
    <p dir="rtl" lang="ar"><strong>استيراد مباشر • سعر بسيط</strong></p>
    ${STORE.guar_en?`<p><strong>${esc(STORE.guar_en)}</strong></p>`:""}${STORE.guar_ar?`<p dir="rtl" lang="ar"><strong>${esc(STORE.guar_ar)}</strong></p>`:""}
    <p>${esc(STORE.addr_en)}</p>
    <p dir="rtl" lang="ar">${esc(STORE.addr_ar)}</p>
    <p><strong>${esc(STORE.hours_en)}</strong><br>${esc(STORE.deliv_en)}</p>
    <p dir="rtl" lang="ar">${esc(STORE.hours_ar)}<br>${esc(STORE.deliv_ar)}</p>
    <div class="wa"><span>WhatsApp us · راسلونا على واتساب</span>
      <span class="num">${esc(WA)}</span>
      <div class="btns"><button class="btn" id="copywa">Copy WhatsApp number</button>
      <a class="btn alt" href="${WA_LINK}" target="_blank" rel="noopener">Open in WhatsApp</a>
      <a class="btn alt" href="${esc(mapsLink())}" target="_blank" rel="noopener">Get directions</a></div>
      <small>If WhatsApp doesn't open, copy the number and message us.<br><span dir="rtl" lang="ar">إذا لم يفتح واتساب، انسخ الرقم وراسلنا.</span></small></div>
  </section>`}
function adCard(){
  const kinds=["store","coupon","order","delivery"];
  let k=kinds[adN++%kinds.length];
  const cp=ITEMS.find(x=>x.id==="CP1");
  if(k==="coupon"&&!cp)k="order";
  if(k==="store")return infoCard();
  if(k==="coupon")return `<section class="card ad adcoupon"><div class="bgblur" data-bg="coupon-jewellery.jpg"></div><img class="media" src="coupon-jewellery.jpg" alt="Jewellery coupon"><div class="adbar"><span class="adtag">AD · إعلان</span><div class="adh">Jewellery 0.250<i class="omr" role="img" aria-label="OMR"></i></div><div class="adp">Until 3 November · حتى ٣ نوفمبر</div><button class="btn" data-goto="Jewellery">Shop jewellery · تسوق</button></div></section>`;
  if(k==="order")return `<section class="card end ad adgreen"><span class="adtag">AD · إعلان</span><img class="logo" src="logo.png" alt="Dollar Store Oman"><h2>Order on WhatsApp</h2><p dir="rtl" lang="ar"><strong>اطلب عبر واتساب</strong></p><p>Send the product name. We reply fast.</p><div class="btns"><a class="btn" href="${WA_LINK}" target="_blank" rel="noopener">Open WhatsApp · واتساب</a></div><span class="num">${esc(WA)}</span></section>`;
  return `<section class="card end ad"><span class="adtag">AD · إعلان</span><img class="logo" src="logo.png" alt="Dollar Store Oman"><h2>${esc(STORE.deliv_en)}</h2><p dir="rtl" lang="ar"><strong>${esc(STORE.deliv_ar)}</strong></p><p>${esc(STORE.hours_en)}</p><p style="opacity:.7;font-size:.78rem">Product images are for illustration · الصور للتوضيح</p><div class="btns"><a class="btn alt" href="${esc(mapsLink())}" target="_blank" rel="noopener">Get directions · الموقع</a></div></section>`;
}
function pickBatch(first){
  if(first){const list=ITEMS.filter(p=>state.cat==="All"||(state.cat==="Clearance"?(p.cat!=="Coupons"&&+priceOf(p)<0.729):p.cat===state.cat));list.forEach(p=>shown.add(p.id));return list}
  let pool=ITEMS.filter(p=>!shown.has(p.id));
  if(pool.length<6){shown=new Set();pool=ITEMS.slice()}
  const b=shuffle(pool).slice(0,12);b.forEach(p=>shown.add(p.id));return b;
}
function appendBatch(first){
  const items=pickBatch(first);let out="";
  items.forEach(p=>{out+=card(p);if(++sinceAd>=6){sinceAd=0;out+=adCard()}});
  feed.insertAdjacentHTML("beforeend",out);observe();
}
function renderFeed(){
  adN=0;sinceAd=0;shown=new Set();feed.innerHTML="";appendBatch(true);
  if(!feed.querySelector(".card[data-id]"))appendBatch(false);
  feed.scrollTop=0;
}
feed.addEventListener("scroll",()=>{if(loading)return;if(feed.scrollTop+feed.clientHeight*4>feed.scrollHeight){loading=true;appendBatch(false);setTimeout(()=>loading=false,250)}},{passive:true});
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;state.cat=b.dataset.cat;
  chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));
  chips.scrollTo({left:Math.max(0,b.offsetLeft-16),behavior:"smooth"});renderFeed()});

let io,timer;
const bgIO=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const b=en.target.querySelector(".bgblur[data-bg]");if(b){b.style.backgroundImage=`url('${b.dataset.bg}')`;b.removeAttribute("data-bg")}bgIO.unobserve(en.target)}}),{root:feed,rootMargin:"200% 0px"});
function observe(){
  feed.querySelectorAll(".card:not([data-bgo])").forEach(c=>{c.dataset.bgo=1;bgIO.observe(c)});
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{const c=en.target;
    if(en.isIntersecting&&en.intersectionRatio>.6){feed.querySelectorAll(".card.on").forEach(x=>{if(x!==c)x.classList.remove("on")});c.classList.add("on");autoplay(c)}
    else c.classList.remove("on")}),{root:feed,threshold:[0,.6]});
  feed.querySelectorAll(".card[data-id]").forEach(c=>io.observe(c));
}
function autoplay(c){clearInterval(timer);const g=c.querySelector(".gal");if(!g||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  timer=setInterval(()=>{const n=g.children.length,i=Math.round(g.scrollLeft/g.clientWidth);g.scrollTo({left:((i+1)%n)*g.clientWidth,behavior:"smooth"})},2600)}
feed.addEventListener("pointerdown",e=>{if(e.target.closest(".gal"))clearInterval(timer)});
feed.addEventListener("click",e=>{
  const more=e.target.closest("[data-more]");
  if(more){const cap=more.closest(".cap");cap.classList.toggle("open");more.textContent=cap.classList.contains("open")?"Less · أقل":"More · المزيد";return}
  const like=e.target.closest("[data-like]"),save=e.target.closest("[data-save]"),share=e.target.closest("[data-share]"),snd=e.target.closest("[data-sound]");
  const go=e.target.closest("[data-goto]");if(go){const c=document.getElementById("chip-"+go.dataset.goto);c&&c.click();return}
  if(e.target.id==="copywa"){copy(WA,"Number copied. Open WhatsApp and paste it");return}
  if(like){toggleLike(like.dataset.like);return}
  if(save){const id=save.dataset.save;state.saved[id]=!state.saved[id];persist();feed.querySelectorAll(`[data-save="${id}"]`).forEach(s=>{s.setAttribute("aria-pressed",!!state.saved[id]);s.querySelector("span").textContent=state.saved[id]?"Saved":"Save"});toast(state.saved[id]?"Saved to your list":"Removed");return}
  if(share){shareItem(find(share.dataset.share));return}
  if(snd){state.muted=!state.muted;feed.querySelectorAll("video").forEach(v=>v.muted=state.muted);feed.querySelectorAll("[data-sound]").forEach(b=>b.textContent=state.muted?"Tap for sound":"Sound on");return}
  const v=e.target.closest(".card.video")&&!e.target.closest(".act,.cap")?e.target.closest(".card").querySelector("video"):null;
  if(v){v.paused?v.play().catch(()=>{}):v.pause()}
});
async function shareItem(p){
  const url=(STORE.site||"").trim()||"https://claude.ai/artifact/XtyS1ZfvzdJ1ZwqCLrC9df";
  const text=p.en+" | "+p.ar+"\n"+priceText(p)+" at Dollar Store Oman, Bousher, Muscat";
  if(navigator.share){try{await navigator.share({title:p.en,text,url});return}catch(e){if(e&&e.name==="AbortError")return}}
  openShareSheet(text,url);
}
function openShareSheet(text,url){
  document.querySelector(".sheet")&&document.querySelector(".sheet").remove();
  const full=text+"\n"+url,enc=encodeURIComponent;
  const el=document.createElement("div");el.className="sheet";
  el.innerHTML=`<div class="sbox"><b>Share · مشاركة</b>
   <a class="sbtn" style="--c:#25d366" target="_blank" rel="noopener" href="https://api.whatsapp.com/send?text=${enc(full)}">WhatsApp</a>
   <a class="sbtn" style="--c:#1877f2" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${enc(url)}&quote=${enc(text)}">Facebook</a>
   <button class="sbtn" style="--c:#d6249f" data-ig>Instagram</button>
   <button class="sbtn" style="--c:#555" data-cp>Copy link</button>
   <button class="sclose" data-sx>Close</button></div>`;
  document.querySelector(".app").appendChild(el);
  el.addEventListener("click",async e=>{
    if(e.target===el||e.target.closest("[data-sx]")){el.remove();return}
    if(e.target.closest("[data-cp]")){await copy(full,"Link copied");return}
    if(e.target.closest("[data-ig]")){await copy(full,"Copied. Paste it in Instagram");window.open("https://www.instagram.com/","_blank","noopener")}
  });
}
function toggleLike(id,force){
  state.liked[id]=force??!state.liked[id];persist();
  feed.querySelectorAll(`[data-like="${id}"]`).forEach(b=>{b.setAttribute("aria-pressed",!!state.liked[id]);b.querySelector("span").textContent=state.liked[id]?"Liked":"Like"});
}
feed.addEventListener("dblclick",e=>{const c=e.target.closest(".card[data-id]");if(!c||e.target.closest(".act"))return;burst(c)});
function burst(c){toggleLike(c.dataset.id,true);const d=document.createElement("div");d.className="burst";d.innerHTML=ICON.heart;c.appendChild(d);setTimeout(()=>d.remove(),750)}

feed.addEventListener("scroll",e=>{const g=e.target;if(!g.classList||!g.classList.contains("gal"))return;
  const i=Math.round(g.scrollLeft/g.clientWidth);g.parentElement.querySelectorAll(".dots i").forEach((d,j)=>d.classList.toggle("on",j===i))},true);


/* ---- Owner control panel: shown only to people who can edit this page; saves by republishing the page ---- */
const RESET=":root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}";
const FONTS="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Readex+Pro:wght@400;600&display=swap";
const SKEL='<div class="app">\n  <header class="top">\n    <nav class="chips" id="chips" aria-label="Filter"></nav>\n  </header>\n  <main class="feed" id="feed"></main>\n  <div class="toast" id="toast" hidden></div>\n</div>';
function buildDoc(d){
  const O="<scr"+"ipt",C="</scr"+"ipt>";
  const css=document.getElementById("css").textContent,code=document.getElementById("code").textContent;
  const json=JSON.stringify(d).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>\n<title>Dollar Store Oman Reels</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="'+FONTS+'">\n<style id="css">'+css+'</style>\n'+SKEL+'\n'+O+' type="application/json" id="data">'+json+C+'\n'+O+' id="code">'+code+C+'\n\n</body></html>';
}
const AI_OPTS=["","AI styled image"];
const STORE_FIELDS=[["big","Big price on last screen"],["wa","WhatsApp number"],["addr_en","Address (English)"],["addr_ar","Address (Arabic)"],["hours_en","Opening hours (English)"],["hours_ar","Opening hours (Arabic)"],["deliv_en","Delivery and payment (English)"],["deliv_ar","Delivery and payment (Arabic)"],["site","Catalogue link people will share"],["maps","Google Maps link for directions (empty = default)"],["guar_en","Guarantee line (English, leave empty to hide)"],["guar_ar","Guarantee line (Arabic, leave empty to hide)"]];
async function initPanel(){
  if(typeof claude==="undefined"||!claude.use)return;
  let user=null,art=null;
  try{user=await claude.use("user");art=await claude.use("artifact")}catch(e){return}
  if(!user||!art||!user.canEdit())return;
  const gear=document.createElement("button");gear.className="gear";gear.textContent="✎ Edit";gear.setAttribute("aria-label","Open control panel");
  document.querySelector(".app").appendChild(gear);
  gear.onclick=()=>openPanel(art);
}
function openPanel(art){
  const draft=JSON.parse(JSON.stringify(DATA));let tab="items",q="";
  const el=document.createElement("div");el.className="panel";
  el.innerHTML=`<div class="ph"><h3>Control panel</h3><button class="pbtn" data-close>Close</button><button class="pbtn go" data-save>Save</button></div>
   <div class="ptabs"><button data-tab="items" aria-pressed="true">Products</button><button data-tab="store" aria-pressed="false">Store info</button></div><div class="pbody"></div>`;
  document.querySelector(".app").appendChild(el);
  const body=el.querySelector(".pbody");
  function modeOf(p){return p.only?"only":p.unit?"unit":"from"}
  function render(){
    el.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===tab));
    if(tab==="store"){
      body.innerHTML=`<p class="pnote">These show on the last screen. Prices and text change for everyone after you tap Save.</p>`+STORE_FIELDS.map(([k,l])=>`<label>${l}<input type="text" data-s="${k}" value="${esc(draft.store[k])}"></label>`).join("");
      return}
    const ql=q.toLowerCase();
    const rows=draft.items.map((p,i)=>({p,i})).filter(({p})=>!ql||(p.en+" "+p.ar+" "+p.id).toLowerCase().includes(ql));
    const T=(i,k,v,x="")=>`<input type="text" ${x} data-i="${i}" data-k="${k}" value="${esc(v)}">`;
    body.innerHTML=`<input type="search" placeholder="Search products" value="${esc(q)}" data-q><p class="pnote">Edit any cell, then tap Save. Swipe the table sideways to see more columns. Only you can see this.</p>
     <div class="twrap"><table class="ptable"><thead><tr><th>Photo</th><th>English name</th><th>Arabic name</th><th>Price (OMR)</th><th>Description</th><th>Details (English | Arabic)</th><th>Photo label</th><th>Hide</th></tr></thead><tbody>`+
     rows.map(({p,i})=>{const im=(p.gallery||[p.src])[0];return `<tr${p.hidden?' class="hid"':''}><td><img src="${esc(im)}" alt=""><small>${esc(p.id)}</small></td>
      <td>${T(i,"en",p.en)}</td><td>${T(i,"ar",p.ar,'dir="rtl"')}</td>
      <td>${T(i,"price",p.price||"0.729",'inputmode="decimal" class="num"')}</td>
      <td><textarea data-i="${i}" data-k="hook">${esc(p.hook)}</textarea></td>
      <td><textarea data-i="${i}" data-k="spec">${esc(p.spec)}</textarea></td>
      <td><select data-i="${i}" data-k="ai">${AI_OPTS.map(o=>`<option value="${esc(o)}"${(p.ai||"")===o?" selected":""}>${o||"Real photo (no label)"}</option>`).join("")}</select></td>
      <td><input type="checkbox" data-i="${i}" data-k="hidden"${p.hidden?" checked":""}></td></tr>`}).join("")+`</tbody></table></div>`;
  }
  el.addEventListener("click",async e=>{
    if(e.target.closest("[data-close]")){el.remove();return}
    const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;render();return}
    if(e.target.closest("[data-save]")){
      const btn=e.target.closest("[data-save]");btn.disabled=true;btn.textContent="Saving…";
      try{await art.publish(buildDoc(draft))}
      catch(err){btn.disabled=false;btn.textContent="Save";toast(err&&err.code==="conflict"?"Someone saved first. The page will reload":"Could not save: "+((err&&err.message)||"try again"))}
    }
  });
  el.addEventListener("input",e=>{
    const f=e.target;
    if(f.dataset.q!==undefined){q=f.value;const pos=f.selectionStart;render();const n=body.querySelector("[data-q]");n.focus();n.setSelectionRange(pos,pos);return}
    if(f.dataset.s){draft.store[f.dataset.s]=f.value;return}
    if(f.dataset.i===undefined)return;
    const p=draft.items[+f.dataset.i],k=f.dataset.k;
    if(k==="mode"){delete p.only;delete p.unit;if(f.value==="only")p.only=true;if(f.value==="unit")p.unit=true}
    else if(k==="hidden")p.hidden=f.checked||undefined;
    else p[k]=f.value;
  });
  render();
}
/* WhatsApp: on phones, try the WhatsApp app directly; if nothing opens, fall back to the web link */
document.addEventListener("click",e=>{
  const a=e.target.closest&&e.target.closest('a[href^="https://api.whatsapp.com/send"]');
  if(!a||!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent))return;
  e.preventDefault();
  const web=a.href,app=web.replace("https://api.whatsapp.com/send","whatsapp://send");
  let left=false;const onHide=()=>{if(document.hidden)left=true};
  document.addEventListener("visibilitychange",onHide);
  const t=document.createElement("a");t.href=app;t.target="_blank";t.rel="noopener";t.style.display="none";document.body.appendChild(t);t.click();t.remove();
  setTimeout(()=>{document.removeEventListener("visibilitychange",onHide);if(!left&&!document.hidden)window.open(web,"_blank","noopener")},1400);
});
renderChips();renderFeed();initPanel();
</script>
</body></html>
